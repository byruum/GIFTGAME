<!DOCTYPE html>
<html>
<head>
<title>GIFT'S PLAYGROUND</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0f172a;color:white;font-family:sans-serif;text-align:center}
canvas{border:4px solid #22c55e;border-radius:10px;background:#1e293b;margin-top:10px;max-width:95%}
h1{color:#22c55e;margin:10px 0 0 0}
p{color:#94a3b8}
button{background:#22c55e;color:black;padding:10px 20px;border:none;border-radius:8px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<h1>🌿 GIFT'S PLAYGROUND 🌿</h1>
<p>Use W A S D to move - Collect the yellow stars!</p>
<canvas id="game" width="800" height="400"></canvas>
<p>Score: <span id="score">0</span> | Press R to Restart</p>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let gift={x:100,y:200,w:30,h:30,speed:5},score=0,keys={},stars=[];
function newStar(){stars.push({x:Math.random()*760+20,y:Math.random()*360+20,r:10})}
for(let i=0;i<5;i++)newStar();
function loop(){
x.clearRect(0,0,800,400);
if(keys['w']||keys['ArrowUp'])gift.y-=gift.speed;
if(keys['s']||keys['ArrowDown'])gift.y+=gift.speed;
if(keys['a']||keys['ArrowLeft'])gift.x-=gift.speed;
if(keys['d']||keys['ArrowRight'])gift.x+=gift.speed;
gift.x=Math.max(0,Math.min(770,gift.x));gift.y=Math.max(0,Math.min(370,gift.y));
x.fillStyle='#22c55e';x.fillRect(gift.x,gift.y,gift.w,gift.h);
x.fillStyle='white';x.fillRect(gift.x+5,gift.y+5,5,5);x.fillRect(gift.x+20,gift.y+5,5,5);
x.fillStyle='#facc15';
stars.forEach((s,i)=>{
x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();
if(Math.hypot(gift.x+15-s.x,gift.y+15-s.y)<25){stars.splice(i,1);score++;document.getElementById('score').textContent=score;newStar();newStar()}
});
requestAnimationFrame(loop)
}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()=='r'){score=0;document.getElementById('score').textContent=0;gift={x:100,y:200,w:30,h:30,speed:5}}});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
loop();
// touch for mobile
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
c.addEventListener('touchmove',e=>{
let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
if(Math.abs(dx)>10)gift.x+=dx>0?5:-5;
if(Math.abs(dy)>10)gift.y+=dy>0?5:-5;
sx=e.touches[0].clientX;sy=e.touches[0].clientY;e.preventDefault();
},{passive:false});
</script>
</body>
</html>
