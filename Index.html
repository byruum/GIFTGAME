<!DOCTYPE html>
<html>
<head>
<title>Gift Game</title>
<style>
body{text-align:center;font-family:sans-serif;background:#e6f7ff}
canvas{border:4px solid green;background:#a3d977}
#status{font-size:28px;font-weight:bold}
</style>
</head>
<body>
<h1>GIFT'S GAME</h1>
<canvas id="game" width="800" height="400"></canvas>
<p id="status">GREEN LIGHT!</p>
<p>Player GIFT: Press W | Player 2: Up Arrow</p>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),s=document.getElementById('status');
let players=[{x:20,y:100,c:'green',k:'w',n:'GIFT'},{x:20,y:200,c:'blue',k:'ArrowUp',n:'002'}];
let green=true;
function draw(){x.clearRect(0,0,800,400);x.fillStyle='black';x.fillRect(750,0,10,400);players.forEach(p=>{x.fillStyle=p.c;x.fillRect(p.x,p.y,40,40);x.fillStyle='white';x.fillText(p.n,p.x+5,p.y+25)})}
setInterval(()=>{green=!green;s.textContent=green?'GREEN LIGHT - GO!':'RED LIGHT - STOP!';s.style.color=green?'green':'red'},3000);
window.addEventListener('keydown',e=>{players.forEach(p=>{if(e.key===p.k){if(green)p.x+=20;else p.x=Math.max(20,p.x-20)}});draw()});
draw();
</script>
</body>
</html>
