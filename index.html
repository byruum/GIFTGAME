<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Trevor Gift - 2 in 1 Forest & Bike Rush</title>
<style>
:root{--green:#78d155;--dark:#1a3d16}
body{margin:0;background:#11210e;color:#fff;font-family:system-ui,Arial;text-align:center;overflow-x:hidden}
.topbar{display:flex;gap:8px;padding:8px;justify-content:center;background:#000a;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:99px;border:2px solid var(--green);font-weight:900;cursor:pointer;background:#000;color:#fff}
.tab.active{background:var(--green);color:#000;box-shadow:0 0 18px var(--green)}
.hud{display:flex;gap:6px;justify-content:center;margin:8px;flex-wrap:wrap}
.pill{background:#000c;padding:6px 12px;border-radius:20px;font-weight:900;border:1px solid #ffffff22}
canvas{width:100%;max-width:760px;height:480px;border:4px solid var(--green);border-radius:18px;background:#6bb8ff;display:block;margin:0 auto;touch-action:none}
#msg{min-height:34px;font-weight:900;font-size:19px;margin:8px;text-shadow:0 2px 8px #000}
.controls{display:flex;gap:8px;max-width:760px;margin:0 auto;padding:0 8px}
.controls button{padding:16px 10px;border-radius:16px;border:2px solid var(--green);font-weight:900;font-size:20px;flex:1}
#runBtn{background:var(--green);color:#000;flex:1.6;font-size:22px}
#startBtn{margin:10px auto;width:100%;max-width:760px;background:#fff;color:#000;padding:14px;border-radius:16px;font-weight:900;font-size:20px;border:0}
.bike-only{display:none}.foot-only{display:none}
body.mode-bike.bike-only{display:block}body.mode-bike.bike-only.flex{display:flex}
body.mode-foot.foot-only{display:block}body.mode-foot.foot-only.flex{display:flex}
.giftShout{animation:pop 0.3s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
</style>
</head>
<body class="mode-foot">
<div class="topbar">
  <button id="tabFoot" class="tab active">🌳 FOOT RUN - Trevor Forest Path</button>
  <button id="tabBike" class="tab">🏍️ BIKE RUSH - Raving Motorbike</button>
</div>

<div class="hud">
  <span id="levelPill" class="pill">Level 1 - Sunny Meadow</span>
  <span id="lightPill" class="pill">GREEN</span>
  <span id="scorePill" class="pill">🍎 0</span>
  <span id="progPill" class="pill">0%</span>
  <span id="speedPill" class="pill bike-only">💨 0 km/h</span>
</div>

<canvas id="c" width="760" height="480"></canvas>
<div id="msg" class="giftShout">Choose your mode! Foot Run or Motorbike Rush? 🌳🏍️</div>

<div class="controls flex">
  <button id="leftBtn">⬅️</button>
  <button id="runBtn"><span class="foot-only">🏃 HOLD TO RUN</span><span class="bike-only">🏍️ HOLD TO ACCELERATE</span></button>
  <button id="rightBtn">➡️</button>
</div>
<button id="startBtn">START</button>

<div class="foot-only" style="max-width:760px;margin:10px auto;opacity:0.8;font-size:14px">Green Light = Run, Red Light = Freeze! Dodge 🪨🪵 collect 🍎</div>
<div class="bike-only" style="max-width:760px;margin:10px auto;opacity:0.9;font-size:14px;font-weight:800">🏍️ TEMPLE RUN STYLE! Dodge trees, jump logs, shout GIFT GIFT! Hold to boost, swipe to dodge!</div>

<script type="module">
let mode = 'foot';
const body = document.body;
const c = document.getElementById('c'); const ctx = c.getContext('2d');
const msg = document.getElementById('msg');
function say(t, rate=1){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=rate;u.pitch=mode==='bike'?0.8:1.1;u.volume=1;speechSynthesis.speak(u);}catch{}}
let giftInterval;
function startGiftShout(){clearInterval(giftInterval); if(mode!=='bike')return; let count=0; giftInterval=setInterval(()=>{ if(!game.running)return; let texts=["GIFT! GIFT!","GIFT GIFT GO GO!","GIFT!","LET'S GO GIFT!"]; let txt=texts[Math.floor(Math.random()*texts.length)]; msg.textContent="🏍️ "+txt+" 🏍️"; msg.classList.remove('giftShout'); void msg.offsetWidth; msg.classList.add('giftShout'); say(txt,1.15); count++; }, 2200);}

const FOOT_LEVELS=[
{name:"Sunny Meadow Trail",kind:"lights",guard:"🦉",treat:"🍎",green:6500,red:1700,speed:0.85,goal:1300},
{name:"Butterfly Path",kind:"lights",guard:"🦋",treat:"🍓",green:6000,red:2000,speed:0.9,goal:1500},
{name:"Magic Bridge",kind:"bridge",guard:"🧚",treat:"💎",green:5400,red:2100,speed:1.15,goal:1700},
{name:"Racing Horse",kind:"race",guard:"🏁",treat:"🥕",green:8000,red:1500,speed:1.2,goal:1900,rival:{icon:"🐎",speed:0.52,label:"Thunder"}},
{name:"Racing Bicycle",kind:"race",guard:"🚴",treat:"🍋",green:9000,red:1500,speed:1.25,goal:2100,rival:{icon:"🚲",speed:0.6,label:"Zippy"}},
{name:"Sparkle Grove",kind:"lights",guard:"🦁",treat:"⭐",green:4800,red:2600,speed:1.05,goal:2300},
];

const BIKE_LEVELS=[
{name:"Forest Entry - Raving Start",goal:1800,baseSpeed:1.6, maxSpeed:2.8, obstacleFreq:38, treat:"⛽"},
{name:"Pine Storm Path",goal:2400,baseSpeed:1.9, maxSpeed:3.2, obstacleFreq:32, treat:"💎"},
{name:"Mud Splash Curve",goal:3000,baseSpeed:2.2, maxSpeed:3.6, obstacleFreq:28, treat:"🔥"},
{name:"Thunder Hill Climb",goal:3800,baseSpeed:2.5, maxSpeed:4.0, obstacleFreq:24, treat:"⭐"},
];

let level=0,score=0,phase="ready";
let game={dist:0,x:0,targetX:0,rival:0,bob:0,items:[],running:false,red:false,holding:false,steer:0,speed:0};

function buildItemsFoot(lv){
 let items=[];
 for(let z=60;z<lv.goal+60;z+=26){items.push({z:z+Math.random()*8,lane:-2.6,type:"tree",icon:"🌳",gone:false});items.push({z:z+Math.random()*8,lane:2.6,type:"tree",icon:"🌲",gone:false});}
 for(let z=120;z<lv.goal-40;z+=55+Math.random()*45){let lane=[-1,0,1][Math.floor(Math.random()*3)]; if(Math.random()<0.55)items.push({z,lane,type:Math.random()<0.5?"rock":"log",icon:Math.random()<0.5?"🪨":"🪵",gone:false}); else items.push({z,lane,type:"treat",icon:lv.treat,gone:false});}
 return items;
}
function buildItemsBike(lv){
 let items=[];
 for(let z=60;z<lv.goal+200;z+=18){items.push({z:z+Math.random()*5,lane:-2.7,type:"tree",icon:Math.random()<0.5?"🌳":"🌲",gone:false});items.push({z:z+Math.random()*5,lane:2.7,type:"tree",icon:Math.random()<0.5?"🌳":"🌲",gone:false});}
 for(let z=100;z<lv.goal;z+=lv.obstacleFreq+Math.random()*20){
  let lane=[-1.2,-0.4,0.4,1.2][Math.floor(Math.random()*4)];
  let r=Math.random();
  if(r<0.55) items.push({z,lane,type:"rock",icon:["🪨","🪵","🪨","🚧"][Math.floor(Math.random()*4)],gone:false});
  else if(r<0.75) items.push({z,lane,type:"jump",icon:"🪵",gone:false, low:true});
  else items.push({z,lane,type:"treat",icon:lv.treat,gone:false});
 }
 return items;
}

function getLevels(){ return mode==='foot'?FOOT_LEVELS:BIKE_LEVELS }
function currentLevel(){ return getLevels()[level] }

function startLevel(idx){
 let lvls=getLevels(); let i=Math.min(idx,lvls.length-1); level=i; let l=lvls[i];
 let items = mode==='foot'?buildItemsFoot(l):buildItemsBike(l);
 game={dist:0,x:0,targetX:0,rival:0,bob:0,items,running:true,red:false,holding:false,steer:0,speed:l.baseSpeed||1.5};
 phase= mode==='foot'?"green":"racing";
 score=0; document.getElementById('scorePill').textContent=`${l.treat} 0`;
 document.getElementById('levelPill').textContent=`Level ${i+1}/${lvls.length} · ${l.name}`;
 if(mode==='foot'){
  document.getElementById('lightPill').style.display='inline-block';
  document.getElementById('lightPill').textContent="GREEN";
  document.getElementById('lightPill').style.background="#22c55e";
  msg.textContent=`${l.name} — Green Light Go!`; say(`${l.name}. Green light. Go Trevor!`); scheduleLight();
 }else{
  document.getElementById('lightPill').style.display='none';
  msg.textContent=`🏍️ ${l.name} — HOLD TO BOOST! GIFT! GIFT!`; say("Raving Motorbike! Gift! Gift! Go!",1.1); startGiftShout();
 }
}

let lightTimer;
function scheduleLight(){clearTimeout(lightTimer); if(mode!=='foot')return; let lv=FOOT_LEVELS[level]; let base=phase==="green"?lv.green:lv.red;
 lightTimer=setTimeout(()=>{ phase=phase==="green"?"red":"green"; game.red=phase==="red"; let pill=document.getElementById('lightPill'); pill.textContent=phase.toUpperCase(); pill.style.background=phase==="red"?"#ef4444":"#22c55e";
 if(phase==="red"){msg.textContent="🔴 RED LIGHT — FREEZE!"; say("Red light! Freeze Trevor!",1.1);}else{msg.textContent="🟢 GREEN LIGHT — RUN!"; say("Green light! Run Trevor!",1.1);}
 if(game.running) scheduleLight();}, base+Math.random()*900);
}

function finish(won,text){
 game.running=false; clearTimeout(lightTimer); clearInterval(giftInterval);
 msg.textContent=text; say(text, won?1:0.9); phase=won?"won":"lost";
 document.getElementById('startBtn').textContent=won?(level+1<getLevels().length?"NEXT TRACK":"AGAIN!"):"TRY AGAIN";
}

function loop(){
 requestAnimationFrame(loop);
 let g=game; let L=currentLevel(); if(!L) return;
 let W=c.width,H=c.height;
 if(g.running){
  g.x+=(g.targetX-g.x)*0.18; g.targetX=Math.max(-1.35,Math.min(1.35,g.targetX+g.steer*0.08));
  if(g.holding){
   if(mode==='foot' && g.red){ finish(false,"Moved on red! Good trial Trevor, let's go again!"); }
   else{
    if(mode==='bike'){
     g.speed = Math.min(L.maxSpeed, g.speed+0.04); g.dist+=g.speed; g.bob+=0.32;
     document.getElementById('speedPill').textContent=`💨 ${Math.floor(g.speed*45)} km/h`;
    }else{ g.dist+=L.speed; g.bob+=0.22; }
    let p=Math.min(100,(g.dist/L.goal)*100); document.getElementById('progPill').textContent=Math.floor(p)+"%";
    if(g.dist>=L.goal) finish(true, mode==='bike'?`YOU DID IT! GIFT GIFT! Track cleared! 🏍️💨`:`Amazing Trevor! ${["Good trial Trevor, let's go again!","Super fast legs!"][Math.floor(Math.random()*2)]}`);
   }
  }else{
   if(mode==='bike'){ g.speed=Math.max(L.baseSpeed*0.6,g.speed-0.025); g.bob+=0.1; document.getElementById('speedPill').textContent=`💨 ${Math.floor(g.speed*45)} km/h`; }
  }
  if(mode==='foot' && L.rival &&!g.red){ g.rival+=L.rival.speed; if(g.rival>=L.goal) finish(false,`${L.rival.label} won! Good trial Trevor, let's go again!`); }
  for(let it of g.items){ if(it.gone||it.type==="tree")continue; let dz=it.z-g.dist; if(dz>-4&&dz<5.5&&Math.abs(it.lane-g.x)<0.85){
   if(it.type==="treat"){ it.gone=true; score++; document.getElementById('scorePill').textContent=`${L.treat} ${score}`; if(mode==='bike'){say("Gift!",1.3); msg.textContent="GIFT! +1 ⛽";} }
   else if(it.type==="jump"){ if(mode==='bike' && g.speed<2.0){ it.gone=true; finish(false,"You hit a log! Jump needs speed! GIFT GIFT, try again!"); } }
   else{ it.gone=true; finish(false, mode==='bike'?"CRASH! 💥 GIFT GIFT, let's go again!":"Bump! Good trial Trevor, let's go again!"); }
  }}
 }
 let bobY=Math.sin(g.bob)*(mode==='bike'?8:5); let horizon=H*0.32+bobY;
 ctx.fillStyle=mode==='bike'?"#1f4a2a":"#87ceeb"; ctx.fillRect(0,0,W,horizon);
 let grd=ctx.createLinearGradient(0,horizon,0,H); if(mode==='bike'){grd.addColorStop(0,"#2d5a27");grd.addColorStop(1,"#0f2310");}else{grd.addColorStop(0,"#3f7d33");grd.addColorStop(1,"#2b5722");} ctx.fillStyle=grd; ctx.fillRect(0,horizon,W,H-horizon);
 let cx=W/2-g.x*70; let scaleAt=dz=>680/Math.max(1,dz); let project=(lane,dz)=>{let s=scaleAt(dz); return{sx:cx+(lane-g.x)*s*0.58,sy:horizon+s*0.44,s};};
 let near=project(0,6),far=project(0,340); let nearW=near.s*(mode==='bike'?2.2:1.5),farW=far.s*(mode==='bike'?2.2:1.5);
 ctx.beginPath(); ctx.moveTo(near.sx-nearW,H); ctx.lineTo(far.sx-farW,far.sy); ctx.lineTo(far.sx+farW,far.sy); ctx.lineTo(near.sx+nearW,H); ctx.closePath(); ctx.fillStyle=mode==='bike'?"#3a3a3a":"#a8763e"; ctx.fill();
 ctx.fillStyle=mode==='bike'?"#f5d547":"#fff"; for(let i=0;i<24;i++){let dz=10+i*14-(g.dist%14); let p=project(0,dz); let w=p.s*0.08; ctx.fillRect(p.sx-w,p.sy,w*2,p.s*0.06);}
 let visible=g.items.map(it=>({it,dz:it.z-g.dist})).filter(o=>o.dz>4&&o.dz<320&&!o.it.gone).sort((a,b)=>b.dz-a.dz);
 ctx.textAlign="center"; ctx.textBaseline="bottom";
 for(let{it,dz}of visible){let p=project(it.lane,dz); let size=Math.min(280,p.s*(it.type==="tree"?0.95:0.46)); ctx.font=`${size}px serif`; ctx.fillText(it.icon,p.sx,p.sy+size*0.15);}
 if(mode==='foot'&&currentLevel().rival){let dz=g.rival-g.dist; if(dz>4&&dz<320){let p=project(0.9,dz); let size=Math.min(240,p.s*0.5); ctx.font=`${size}px serif`; ctx.fillText(currentLevel().rival.icon,p.sx,p.sy+size*0.1);}}
 let dzGoal=currentLevel().goal-g.dist; if(dzGoal>2&&dzGoal<340){let p=project(0,dzGoal); let size=Math.min(300,p.s*0.6); ctx.font=`${size}px serif`; ctx.fillText("🏁",p.sx,p.sy+size*0.1);}
 let playerY=H-42+Math.sin(g.bob)*4; let playerX=W/2+Math.sin(g.bob*0.5)*4;
 ctx.font=`${mode==='bike'?64:52}px serif`; ctx.fillText(mode==='bike'?"🏍️":"🏃‍♂️",playerX,playerY);
 if(g.red&&g.running&&mode==='foot'){ctx.fillStyle="rgba(220,38,38,0.3)"; ctx.fillRect(0,0,W,H);}
}
loop();

function switchMode(newMode){
 mode=newMode; body.className='mode-'+newMode;
 document.getElementById('tabFoot').classList.toggle('active',newMode==='foot');
 document.getElementById('tabBike').classList.toggle('active',newMode==='bike');
 level=0; phase="ready"; game.running=false; clearTimeout(lightTimer); clearInterval(giftInterval);
 document.getElementById('startBtn').textContent="START";
 if(newMode==='bike'){msg.textContent="🏍️ Raving Motorbike Mode! Temple Run in Forest! Shouting GIFT GIFT!"; say("Motorbike mode! Gift Gift! Let's rave!");}
 else{msg.textContent="🌳 Forest Foot Run! Green light go, red light freeze!"; say("Forest foot run!");}
}
document.getElementById('tabFoot').onclick=()=>switchMode('foot');
document.getElementById('tabBike').onclick=()=>switchMode('bike');

document.getElementById('startBtn').onclick=()=>{ if(phase==="won")startLevel(level+1>=getLevels().length?0:level+1); else if(phase==="ready"||phase==="lost")startLevel(level); else startLevel(level); };
let left=document.getElementById('leftBtn'), right=document.getElementById('rightBtn'), run=document.getElementById('runBtn');
left.onpointerdown=(e)=>{e.preventDefault();game.steer=-1}; left.onpointerup=()=>game.steer=0; left.onpointerleave=()=>game.steer=0;
right.onpointerdown=(e)=>{e.preventDefault();game.steer=1}; right.onpointerup=()=>game.steer=0; right.onpointerleave=()=>game.steer=0;
run.onpointerdown=(e)=>{e.preventDefault();game.holding=true}; run.onpointerup=()=>game.holding=false; run.onpointerleave=()=>game.holding=false;
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(); let x=(e.clientX-r.left)/r.width; if(x<0.33)game.steer=-1; else if(x>0.66)game.steer=1; else game.holding=true;});
c.addEventListener('pointerup',()=>{game.steer=0; game.holding=false;});
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase(); if(["w","arrowup"," "].includes(k)){e.preventDefault();game.holding=true;} if(k==="a"||k==="arrowleft")game.steer=-1; if(k==="d"||k==="arrowright")game.steer=1;});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase(); if(["w","arrowup"," "].includes(k))game.holding=false; if(["a","d","arrowleft","arrowright"].includes(k))game.steer=0;});
</script>
</body>
</html>
