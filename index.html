<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TALIA TREVOR REAL FOREST WA8228</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#000;overflow:hidden;font-family:system-ui}#bg{position:absolute;inset:0;background:url('IMG-20260910-WA8228.jpg') center top/cover no-repeat,linear-gradient(#1a3d1a,#0a1a0a);filter:brightness(0.92) contrast(1.05)}#c{position:absolute;inset:0;width:100vw;height:100vh;z-index:3}#hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}.pill{padding:10px 16px;border-radius:20px;background:rgba(0,0,0,0.88);border:2px solid #22c55e;color:#fff;font-weight:800;font-size:11px}.pill.on{background:#22c55e;color:#000}#controls{position:fixed;bottom:6px;left:6px;right:6px;z-index:30;display:flex;gap:6px}.cbtn{flex:1;height:84px;border-radius:16px;background:rgba(0,0,0,0.55);border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px}#mid{display:flex;flex-direction:column;gap:5px;flex:1.2}.abtn{width:100%;height:40px;border-radius:12px;border:none;font-weight:800;font-size:12px}#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;background:rgba(0,0,0,0.94);padding:22px;border-radius:22px;border:3px solid #22c55e;text-align:center;color:#fff;max-width:88%}</style></head><body>
<div id="bg"></div><canvas id="c"></canvas>
<div id="hud"><div style="display:flex;gap:6px"><button class="pill on" id="bf">🏃 TALIA FOOT RUN</button><button class="pill" id="bb">🏍️ TREVOR BIKE RACE</button></div><div class="pill">SCORE <span id="sc">0</span> | <span id="ds">0</span>m | TALIA <span id="ta">0</span></div></div>
<div id="controls"><div class="cbtn" id="btnL">◀️ LEFT</div><div id="mid"><button class="abtn" id="btnJ" style="background:#fde047">⬆️ JUMP</button><button class="abtn" id="btnS" style="background:#fb923c">⬇️ SLIDE</button></div><div class="cbtn" id="btnR">RIGHT ▶️</div></div>
<div id="msg"><h2 style="color:#22c55e">🌲 REAL FOREST WA8228!</h2><p style="font-size:12px;margin:8px 0"><b>TALIA</b> = Foot Run - Real forest!<br><b>TREVOR</b> = Bike + Voice Over!<br>🔊 "Good Trevor, good nice trial Trevor, let's go!"<br>Real forest WA8228, real front run!</p><button class="pill on" style="font-size:15px;padding:12px 28px;margin-top:10px" onclick="start()">▶️ LET'S GO TALIA! LET'S GO TREVOR!</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H;function R(){W=innerWidth;H=innerHeight;let d=devicePixelRatio||1;C.width=W*d;C.height=H*d;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(d,0,0,d,0,0);}R();addEventListener('resize',R);
let mode='foot',lane=1,score=0,dist=0,talia=0,on=false,jump=0,slide=0,obs=[],coins=[],sx=0,sy=0;
function speakTrevor(){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("Good Trevor, good nice trial Trevor, let's go!");u.rate=0.92;u.pitch=1.0;u.volume=1;speechSynthesis.speak(u);} }
function speakTalia(){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("Let's go Talia! Good Talia!");u.rate=1.05;u.pitch=1.4;u.volume=1;speechSynthesis.speak(u);} }
function setM(m){mode=m;document.getElementById('bf').classList.toggle('on',m=='foot');document.getElementById('bb').classList.toggle('on',m=='bike');if(m=='bike')speakTrevor();else speakTalia();}
document.getElementById('bf').onclick=()=>setM('foot');document.getElementById('bb').onclick=()=>setM('bike');
function start(){on=true;score=0;dist=0;lane=1;obs=[];coins=[];jump=0;slide=0;talia=0;document.getElementById('msg').style.display='none';if(mode=='bike')speakTrevor();else speakTalia();requestAnimationFrame(loop);}
function spawn(){if(Math.random()<0.019)obs.push({lane:Math.floor(Math.random()*3),z:1000,type:Math.random()<0.5?'log':'rock'});if(Math.random()<0.055)coins.push({lane:Math.floor(Math.random()*3),z:1000});}
function loop(){if(!on)return;requestAnimationFrame(loop);spawn();let sp=(mode=='bike'?8.2:6.2)+dist*0.0006;dist+=sp*0.18;obs.forEach(o=>o.z-=sp*10);coins.forEach(c=>c.z-=sp*10);obs=obs.filter(o=>o.z>-120);coins=coins.filter(c=>c.z>-120);obs.forEach((o,i)=>{if(o.z<150&&o.z>35&&o.lane==lane){if(o.type=='log'&&jump>15){score+=5;obs.splice(i,1);}else if(o.type=='rock'&&slide>15){score+=5;obs.splice(i,1);}else{if(jump==0&&slide==0){jump=32;score=Math.max(0,score-3);obs.splice(i,1);}}}});coins.forEach((c,i)=>{if(c.z<130&&c.z>35&&c.lane==lane){coins.splice(i,1);score+=10;talia+=1;if(mode=='foot'&&talia%5==0)speakTalia();if(mode=='bike'&&talia%6==0)speakTrevor();}});if(jump>0)jump--;if(slide>0)slide--;draw();document.getElementById('sc').innerText=score;document.getElementById('ds').innerText=Math.floor(dist);document.getElementById('ta').innerText=talia;}
function draw(){X.clearRect(0,0,W,H);let roadTop=H*0.50,rb=W*0.98,rt=W*0.40;X.save();X.beginPath();X.moveTo(W/2-rt/2,roadTop);X.lineTo(W/2-rb/2,H);X.lineTo(W/2+rb/2,H);X.lineTo(W/2+rt/2,roadTop);X.closePath();let g=X.createLinearGradient(0,roadTop,0,H);g.addColorStop(0,'rgba(90,60,25,0.45)');g.addColorStop(1,'rgba(60,35,12,0.82)');X.fillStyle=g;X.fill();X.strokeStyle='rgba(255,255,255,0.92)';X.lineWidth=3;X.setLineDash([30,26]);let off=(Date.now()*0.09)%56;X.lineDashOffset=-off;for(let l=-0.5;l<=0.5;l+=1){let sx=W/2+l*rt*0.5,ex=W/2+l*rb*0.42;X.beginPath();X.moveTo(sx,roadTop);X.lineTo(ex,H);X.stroke();}X.setLineDash([]);X.lineDashOffset=0;X.restore();coins.forEach(c=>{let sc=350/(c.z+350);if(sc<0.09)return;let y=roadTop+(H-roadTop)*(1-sc);let x=W/2+(c.lane-1)*rb*0.30*sc;X.font=(34*sc+26)+'px Arial';X.fillText('🍓',x-17,y);});obs.forEach(o=>{let sc=350/(o.z+350);if(sc<0.10)return;let y=roadTop+(H-roadTop)*(1-sc);let x=W/2+(o.lane-1)*rb*0.30*sc;if(o.type=='log'){X.fillStyle='#1e0a00';X.fillRect(x-60*sc,y-14*sc,120*sc,28*sc);}else{X.fillStyle='#333';X.beginPath();X.ellipse(x,y,32*sc,22*sc,0,0,Math.PI*2);X.fill();}});let lx=W/2+(lane-1)*W*0.28,py=H*0.86-jump*5+(slide?28:0);X.fillStyle='rgba(0,0,0,0.55)';X.beginPath();X.ellipse(lx,H*0.92,42,12,0,0,Math.PI*2);X.fill();if(mode=='foot'){X.save();X.translate(lx,py);let t=Date.now()*0.026;if(jump>0){X.translate(0,-jump*0.9);X.fillStyle='#ec4899';X.fillRect(-22,-58,44,40);X.fillStyle='#111';X.fillRect(-20,-18,40,32);X.fillStyle='#fde68a';X.beginPath();X.arc(0,-70,15,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.font='bold 10px Arial';X.fillText('TALIA',-18,-64);}else if(slide>0){X.fillStyle='#ec4899';X.fillRect(-26,-26,52,28);X.fillStyle='#111';X.fillRect(-24,2,48,20);}else{let leg=Math.sin(t)*30;X.fillStyle='#ec4899';X.fillRect(-21,-56,42,42);X.fillStyle='#111';X.save();X.translate(-11,-14);X.rotate(leg*0.08);X.fillRect(-9,0,18,28);X.restore();X.save();X.translate(11,-14);X.rotate(-leg*0.08);X.fillRect(-9,0,18,28);X.restore();X.fillStyle='#fde68a';X.beginPath();X.arc(0,-68,14,0,Math.PI*2);X.fill();}X.restore();}else{X.save();X.translate(lx,py);X.rotate((lane-1)*0.10);X.font='88px Arial';X.textAlign='center';X.fillText('🏍️',0,26);X.fillStyle='#22c55e';X.font='bold 12px Arial';X.fillText('TREVOR',0,48);X.restore();}}
function L(){lane=Math.max(0,lane-1);}function Rr(){lane=Math.min(2,lane+1);}function J(){if(jump==0&&slide==0)jump=36;}function S(){if(slide==0&&jump==0)slide=30;}
document.getElementById('btnL').ontouchstart=e=>{e.preventDefault();L();};document.getElementById('btnR').ontouchstart=e=>{e.preventDefault();Rr();};document.getElementById('btnJ').ontouchstart=e=>{e.preventDefault();J();};document.getElementById('btnS').ontouchstart=e=>{e.preventDefault();S();};
document.getElementById('btnL').onclick=L;document.getElementById('btnR').onclick=Rr;document.getElementById('btnJ').onclick=J;document.getElementById('btnS').onclick=S;
C.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
C.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>38)Rr();else if(dx<-38)L();}else{if(dy<-38)J();else if(dy>38)S();}}},{passive:false});
</script></body></html>
