<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GIFT - REAL FOREST FRONT</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#000;overflow:hidden;font-family:system-ui}#bg{position:absolute;inset:0;background:url('jungle_ruins_path.webp'),url('IMG-20250910-WA5744.jpg'),linear-gradient(to bottom,#1a3d1a,#0a1a0a);background-size:cover;background-position:center top}#c{position:absolute;inset:0;width:100vw;height:100vh;z-index:3}#hud{position:absolute;top:0;left:0;right:0;z-index:20;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}.pill{padding:10px 16px;border-radius:20px;background:rgba(0,0,0,0.85);border:2px solid #22c55e;color:#fff;font-weight:800;font-size:11px}.pill.on{background:#22c55e;color:#000}#controls{position:fixed;bottom:6px;left:6px;right:6px;z-index:30;display:flex;gap:6px}.cbtn{flex:1;height:80px;border-radius:16px;background:rgba(0,0,0,0.5);border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px}#mid{display:flex;flex-direction:column;gap:5px;flex:1.2}.abtn{width:100%;height:38px;border-radius:12px;border:none;font-weight:800;font-size:11px}#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:40;background:rgba(0,0,0,0.92);padding:20px;border-radius:20px;border:3px solid #22c55e;text-align:center;color:#fff;max-width:86%}</style></head><body>
<div id="bg"></div><canvas id="c"></canvas>
<div id="hud"><div style="display:flex;gap:6px"><button class="pill on" id="bf">🏃 FOOT FRONT</button><button class="pill" id="bb">🏍️ BIKE FRONT</button></div><div class="pill">SCORE <span id="sc">0</span> | <span id="ds">0</span>m | HIGH <span id="hs">0</span></div></div>
<div id="controls"><div class="cbtn" id="btnL">◀️ LEFT</div><div id="mid"><button class="abtn" id="btnJ" style="background:#fde047">⬆️ JUMP</button><button class="abtn" id="btnS" style="background:#fb923c">⬇️ SLIDE</button></div><div class="cbtn" id="btnR">RIGHT ▶️</div></div>
<div id="msg"><h2 style="color:#22c55e">🌲 REAL FOREST - FRONT RUN!</h2><p style="font-size:12px;margin:8px 0">Real forest photo background!<br>Road BIG in front! Runner BIG on road!<br>No trees to sky! Real depth!</p><button class="pill on" style="font-size:15px;padding:12px 28px;margin-top:10px" onclick="start()">▶️ PLAY REAL FRONT</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H;function R(){W=innerWidth;H=innerHeight;let d=devicePixelRatio||1;C.width=W*d;C.height=H*d;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(d,0,0,d,0,0);}R();addEventListener('resize',R);
let mode='foot',lane=1,score=0,dist=0,high=0,base=6,speed=6,on=false,jump=0,slide=0,obs=[],coins=[],sx=0,sy=0;
function setM(m){mode=m;document.getElementById('bf').classList.toggle('on',m=='foot');document.getElementById('bb').classList.toggle('on',m=='bike');base=m=='bike'?7.8:6;}
document.getElementById('bf').onclick=()=>setM('foot');document.getElementById('bb').onclick=()=>setM('bike');
function start(){on=true;score=0;dist=0;lane=1;obs=[];coins=[];jump=0;slide=0;document.getElementById('msg').style.display='none';requestAnimationFrame(loop);}
function spawn(){if(Math.random()<0.02)obs.push({lane:Math.floor(Math.random()*3),z:1000,type:Math.random()<0.5?'log':'rock'});if(Math.random()<0.05)coins.push({lane:Math.floor(Math.random()*3),z:1000});}
function loop(){if(!on)return;requestAnimationFrame(loop);spawn();speed=base+dist*0.0006;dist+=speed*0.15;obs.forEach(o=>o.z-=speed*9);coins.forEach(c=>c.z-=speed*9);obs=obs.filter(o=>o.z>-100);coins=coins.filter(c=>c.z>-100);obs.forEach((o,i)=>{if(o.z<140&&o.z>25&&o.lane==lane){if(o.type=='log'&&jump>12){score+=5;obs.splice(i,1);}else if(o.type=='rock'&&slide>12){score+=5;obs.splice(i,1);}else{if(jump==0)jump=28;obs.splice(i,1);score=Math.max(0,score-3);}}});coins.forEach((c,i)=>{if(c.z<120&&c.z>25&&c.lane==lane){coins.splice(i,1);score+=10;high=Math.max(high,score);}});if(jump>0)jump--;if(slide>0)slide--;draw();document.getElementById('sc').innerText=score;document.getElementById('ds').innerText=Math.floor(dist);document.getElementById('hs').innerText=high;}
function draw(){X.clearRect(0,0,W,H);let roadTop=H*0.58,rb=W*0.98,rt=W*0.35;X.save();X.beginPath();X.moveTo(W/2-rt/2,roadTop);X.lineTo(W/2-rb/2,H);X.lineTo(W/2+rb/2,H);X.lineTo(W/2+rt/2,roadTop);X.closePath();let g=X.createLinearGradient(0,roadTop,0,H);g.addColorStop(0,'rgba(101,67,33,0.8)');g.addColorStop(1,'rgba(61,40,20,0.95)');X.fillStyle=g;X.fill();X.strokeStyle='rgba(255,255,255,0.85)';X.lineWidth=3;X.setLineDash([26,22]);let off=(Date.now()*0.07)%48;X.lineDashOffset=-off;for(let l=-0.5;l<=0.5;l+=1){let sx=W/2+l*rt*0.5,ex=W/2+l*rb*0.42;X.beginPath();X.moveTo(sx,roadTop);X.lineTo(ex,H);X.stroke();}X.setLineDash([]);X.lineDashOffset=0;X.restore();coins.forEach(c=>{let sc=320/(c.z+320);if(sc<0.09)return;let y=roadTop+(H-roadTop)*(1-sc);let x=W/2+(c.lane-1)*rb*0.30*sc;X.font=(30*sc+22)+'px Arial';X.fillText('🍓',x-15,y);});obs.forEach(o=>{let sc=320/(o.z+320);if(sc<0.1)return;let y=roadTop+(H-roadTop)*(1-sc);let x=W/2+(o.lane-1)*rb*0.30*sc;if(o.type=='log'){X.fillStyle='#1a0800';X.fillRect(x-52*sc,y-10*sc,104*sc,20*sc);}else{X.fillStyle='#333';X.beginPath();X.ellipse(x,y,28*sc,18*sc,0,0,Math.PI*2);X.fill();}});let lx=W/2+(lane-1)*W*0.27,py=H*0.88-jump*4.5+(slide?26:0);X.fillStyle='rgba(0,0,0,0.5)';X.beginPath();X.ellipse(lx,H*0.93,36,10,0,0,Math.PI*2);X.fill();if(mode=='foot'){X.save();X.translate(lx,py);let t=Date.now()*0.022;if(jump>0){X.translate(0,-jump*0.8);X.fillStyle='#16a34a';X.fillRect(-18,-50,36,32);X.fillStyle='#111';X.fillRect(-16,-18,32,28);X.fillStyle='#fde68a';X.beginPath();X.arc(0,-60,13,0,Math.PI*2);X.fill();}else if(slide>0){X.fillStyle='#16a34a';X.fillRect(-22,-22,44,24);X.fillStyle='#111';X.fillRect(-20,2,40,18);}else{let leg=Math.sin(t)*26;X.fillStyle='#16a34a';X.fillRect(-17,-48,34,34);X.fillStyle='#111';X.save();X.translate(-9,-14);X.rotate(leg*0.07);X.fillRect(-8,0,16,24);X.restore();X.save();X.translate(9,-14);X.rotate(-leg*0.07);X.fillRect(-8,0,16,24);X.restore();X.fillStyle='#fde68a';X.beginPath();X.arc(0,-58,12,0,Math.PI*2);X.fill();}X.restore();}else{X.save();X.translate(lx,py);X.rotate((lane-1)*0.22);X.font='88px Arial';X.fillText('🏍️',-44,22);X.restore();}}
function L(){lane=Math.max(0,lane-1);}function Rr(){lane=Math.min(2,lane+1);}function J(){if(jump==0)jump=32;}function S(){if(slide==0)slide=26;}
document.getElementById('btnL').ontouchstart=e=>{e.preventDefault();L();};document.getElementById('btnR').ontouchstart=e=>{e.preventDefault();Rr();};document.getElementById('btnJ').ontouchstart=e=>{e.preventDefault();J();};document.getElementById('btnS').ontouchstart=e=>{e.preventDefault();S();};
document.getElementById('btnL').onclick=L;document.getElementById('btnR').onclick=Rr;document.getElementById('btnJ').onclick=J;document.getElementById('btnS').onclick=S;
C.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
C.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>35)Rr();else if(dx<-35)L();}else{if(dy<-35)J();else if(dy>35)S();}},{passive:false});
</script></body></html>
