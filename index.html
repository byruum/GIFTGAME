<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GIFT - Temple Run REAL</title><style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;overflow:hidden;font-family:system-ui}
#bg{position:absolute;inset:0;background:linear-gradient(to bottom, #87CEEB 0%, #228B22 50%, #14532d 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;z-index:2}
#hud{position:absolute;top:0;left:0;right:0;z-index:10;padding:8px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;justify-content:center}
.pill{padding:8px 14px;border-radius:20px;background:rgba(0,0,0,0.8);border:2px solid #22c55e;color:#fff;font-weight:800;font-size:11px}
.pill.on{background:#22c55e;color:#000;box-shadow:0 0 15px #22c55e}
#controls{position:absolute;bottom:10px;left:8px;right:8px;z-index:10;display:flex;justify-content:space-between;gap:8px}
.cbtn{width:32%;height:95px;border-radius:18px;background:rgba(255,255,255,0.22);border:2px solid rgba(255,255,255,0.5);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px}
#mid{display:flex;flex-direction:column;gap:6px;width:36%}
.abtn{width:100%;height:44px;border-radius:12px;border:none;font-weight:900;font-size:13px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,0.92);padding:20px;border-radius:20px;border:3px solid #22c55e;text-align:center;color:#fff;max-width:88%}
#childImg{position:absolute;z-index:4;width:85px;height:125px;object-fit:cover;border-radius:12px;border:3px solid #22c55e;display:none;box-shadow:0 4px 15px rgba(0,0,0,0.8)}
</style></head><body>
<div id="bg"></div>
<canvas id="c"></canvas>
<img id="childImg" src="https://byruum.github.io/GIFTGAME/IMG-20250910-WA9098.jpg" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD04NSBoZWlnaHQ9MTI1IHZpZXdCb3g9IjAgMCA4NSAxMjUiIGZpbGw9Im5vbmUiPjxjaXJjbGUgY3g9IjQyLjUiIGN5PSIzMCIgcj0iMjAiIGZpbGw9IiNmYmJmMjQiLz48cmVjdCB4PSIyMCIgeT0iNTAiIHdpZHRoPSI0NSIgaGVpZ2h0PSI0MCIgZmlsbD0iIzIyYzU1ZSIgcng9IjgiLz48L3N2Zz4='">
<div id="hud"><div class="row"><button class="pill on" id="bf">FOOT - Real Child</button><button class="pill" id="bb">BIKE - Racing</button></div><div class="row"><span class="pill">SCORE <span id="sc">0</span> | <span id="ds">0</span>m | HIGH <span id="hs">0</span></span></div></div>
<div id="controls"><div class="cbtn" id="btnL">◀️<br>LEFT</div><div id="mid"><button class="abtn" id="btnJump" style="background:#facc15">⬆️ JUMP</button><button class="abtn" id="btnSlide" style="background:#fb923c">⬇️ SLIDE</button></div><div class="cbtn" id="btnR">RIGHT<br>▶️</div></div>
<div id="msg"><h2 style="color:#22c55e">🏃 GIFT - REAL TEMPLE RUN FIXED 🌍</h2><p style="font-size:12px;margin:8px 0">FIXED: Control buttons + Real child + No black!<br>Tap buttons or swipe like Temple Run!</p><button class="pill on" style="font-size:15px;padding:12px 28px;margin-top:10px" onclick="startGame()">▶️ PLAY NOW - BUTTONS FIXED</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight;function R(){W=innerWidth;H=innerHeight;let d=devicePixelRatio||1;canvas.width=W*d;canvas.height=H*d;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}R();addEventListener('resize',R);
let mode='foot',lane=1,score=0,dist=0,high=0,base=5,speed=5,on=false,jump=0,slide=0;let obs=[],coins=[];let sx=0,sy=0;
function setMode(m){mode=m;document.getElementById('bf').classList.toggle('on',m==='foot');document.getElementById('bb').classList.toggle('on',m==='bike');base=m==='bike'?7:5;}
document.getElementById('bf').onclick=()=>setMode('foot');document.getElementById('bb').onclick=()=>setMode('bike');
function startGame(){on=true;score=0;dist=0;lane=1;obs=[];coins=[];jump=0;slide=0;document.getElementById('msg').style.display='none';document.getElementById('childImg').style.display=mode==='foot'?'block':'none';requestAnimationFrame(loop);}
function spawn(){if(Math.random()<0.02)obs.push({lane:Math.floor(Math.random()*3),z:1000,type:Math.random()<0.5?'log':'rock'});if(Math.random()<0.05)coins.push({lane:Math.floor(Math.random()*3),z:1000,b:Math.random()*6});}
function loop(){if(!on)return;requestAnimationFrame(loop);spawn();speed=base+dist*0.0006;dist+=speed*0.14;obs.forEach(o=>o.z-=speed*7);coins.forEach(c=>{c.z-=speed*7;c.b+=0.13;});obs=obs.filter(o=>o.z>-80);coins=coins.filter(c=>c.z>-80);obs.forEach((o,i)=>{if(o.z<115&&o.z>10&&o.lane===lane){if(o.type==='log'&&jump>9){score+=5;obs.splice(i,1);}else if(o.type==='rock'&&slide>9){score+=5;obs.splice(i,1);}else{if(jump===0)jump=24;obs.splice(i,1);score=Math.max(0,score-2);}}});coins.forEach((c,i)=>{if(c.z<100&&c.z>8&&c.lane===lane){coins.splice(i,1);score+=10;high=Math.max(high,score);}});if(jump>0)jump--;if(slide>0)slide--;draw();document.getElementById('sc').innerText=score;document.getElementById('ds').innerText=Math.floor(dist);document.getElementById('hs').innerText=high;}
function draw(){let horizon=H*0.38;ctx.clearRect(0,0,W,H);let roadWb=W*0.92,roadWt=10;ctx.save();ctx.beginPath();ctx.moveTo(W/2-roadWt/2,horizon);ctx.lineTo(W/2-roadWb/2,H);ctx.lineTo(W/2+roadWb/2,H);ctx.lineTo(W/2+roadWt/2,horizon);ctx.closePath();let rg=ctx.createLinearGradient(0,horizon,0,H);rg.addColorStop(0,'rgba(166,124,82,0.6)');rg.addColorStop(1,'rgba(90,60,30,0.9)');ctx.fillStyle=rg;ctx.fill();ctx.setLineDash([14,14]);ctx.strokeStyle='rgba(255,255,255,0.7)';for(let l=-0.5;l<=0.5;l+=1){let sx=W/2+l*roadWt*0.6,ex=W/2+l*roadWb*0.45;ctx.beginPath();ctx.moveTo(sx,horizon);ctx.lineTo(ex,H);ctx.stroke();}ctx.setLineDash([]);coins.forEach(c=>{let sc=260/(c.z+260);if(sc<0.05)return;let y=horizon+(H-horizon)*(1-sc)-Math.sin(c.b)*5;let x=W/2+(c.lane-1)*roadWb*0.22*sc;ctx.font=(20*sc+16)+'px Arial';ctx.fillText('🍓',x-12,y);});obs.forEach(o=>{let sc=260/(o.z+260);if(sc<0.07)return;let y=horizon+(H-horizon)*(1-sc);let x=W/2+(o.lane-1)*roadWb*0.22*sc;if(o.type==='log'){ctx.fillStyle='#4a2510';ctx.fillRect(x-32*sc,y-5*sc,64*sc,10*sc);}else{ctx.fillStyle='#666';ctx.beginPath();ctx.ellipse(x,y,16*sc,10*sc,0,0,Math.PI*2);ctx.fill();}});ctx.restore();let lx=W/2+(lane-1)*W*0.19,py=H*0.78-jump*3.2+(slide?18:0);let childImg=document.getElementById('childImg');if(mode==='foot'&&on){childImg.style.left=(lx-42)+'px';childImg.style.top=(py-95)+'px';childImg.style.transform=slide?'scaleY(0.6)':'scaleY(1)';if(jump>0)childImg.style.transform+=' translateY(-22px)';childImg.style.display='block';}else if(mode==='foot'){}else{childImg.style.display='none';ctx.save();ctx.translate(lx,py);ctx.rotate((lane-1)*0.28);ctx.font='56px Arial';ctx.fillText('🏍️',-28,12);ctx.restore();}}
function moveLeft(){lane=Math.max(0,lane-1);}function moveRight(){lane=Math.min(2,lane+1);}function doJump(){if(jump===0)jump=26;}function doSlide(){if(slide===0)slide=22;}
document.getElementById('btnL').addEventListener('touchstart',e=>{e.preventDefault();moveLeft();});document.getElementById('btnR').addEventListener('touchstart',e=>{e.preventDefault();moveRight();});document.getElementById('btnJump').addEventListener('touchstart',e=>{e.preventDefault();doJump();});document.getElementById('btnSlide').addEventListener('touchstart',e=>{e.preventDefault();doSlide();});
document.getElementById('btnL').onclick=moveLeft;document.getElementById('btnR').onclick=moveRight;document.getElementById('btnJump').onclick=doJump;document.getElementById('btnSlide').onclick=doSlide;
canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>35)moveRight();else if(dx<-35)moveLeft();}else{if(dy<-35)doJump();else if(dy>35)doSlide();}},{passive:false});
</script></body></html>
