<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TALIA TREVOR WA8228 PLAY</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:system-ui}#bg{position:fixed;inset:0;background:url('IMG-20260910-WA8228.jpg') center/cover no-repeat}#c{position:fixed;inset:0;width:100vw;height:100vh;z-index:5}#hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}.pill{padding:10px 16px;border-radius:20px;background:rgba(0,0,0,0.85);border:2px solid #22c55e;color:#fff;font-weight:800;font-size:11px}.pill.on{background:#22c55e;color:#000}#controls{position:fixed;bottom:6px;left:6px;right:6px;z-index:30;display:flex;gap:6px}.cbtn{flex:1;height:80px;border-radius:16px;background:rgba(0,0,0,0.6);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}#mid{display:flex;flex-direction:column;gap:5px;flex:1.2}.abtn{width:100%;height:38px;border-radius:12px;border:none;font-weight:800}#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:#000;padding:24px;border-radius:20px;border:3px solid #22c55e;text-align:center;color:#fff;width:85%}</style></head><body>
<div id="bg"></div><canvas id="c"></canvas>
<div id="hud"><div style="display:flex;gap:6px"><button class="pill on" id="bf">🏃 TALIA FOOT</button><button class="pill" id="bb">🏍️ TREVOR BIKE</button></div><div class="pill">SCORE <span id="sc">0</span> | <span id="ds">0</span>m | TALIA <span id="ta">0</span></div></div>
<div id="controls"><div class="cbtn" id="btnL">◀️ LEFT</div><div id="mid"><button class="abtn" id="btnJ" style="background:#fde047">JUMP</button><button class="abtn" id="btnS" style="background:#fb923c">SLIDE</button></div><div class="cbtn" id="btnR">RIGHT ▶️</div></div>
<div id="msg"><h2 style="color:#22c55e">🌲 REAL FOREST WA8228!</h2><p style="font-size:13px;margin:10px 0">TALIA = Foot Run<br>TREVOR = Bike Race<br>Real forest, real front run!</p><button class="pill on" id="playBtn" style="font-size:18px;padding:16px 36px;background:#22c55e;color:#000">▶️ PLAY NOW</button></div>
<script>
var mode='foot',lane=1,score=0,dist=0,talia=0,on=false,jump=0,slide=0,obs=[],coins=[],W=innerWidth,H=innerHeight;
var C=document.getElementById('c'),X=C.getContext('2d');
function resize(){W=innerWidth;H=innerHeight;C.width=W*2;C.height=H*2;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(2,0,0,2,0,0);}resize();
window.onresize=resize;
function setM(m){mode=m;document.getElementById('bf').className=m=='foot'?'pill on':'pill';document.getElementById('bb').className=m=='bike'?'pill on':'pill';}
document.getElementById('bf').onclick=function(){setM('foot')};document.getElementById('bb').onclick=function(){setM('bike')};
function startGame(){on=true;score=0;dist=0;lane=1;obs=[];coins=[];jump=0;slide=0;talia=0;document.getElementById('msg').style.display='none';requestAnimationFrame(loop);}
document.getElementById('playBtn').onclick=startGame;
function spawn(){if(Math.random()<0.02)obs.push({lane:Math.floor(Math.random()*3),z:1000});if(Math.random()<0.06)coins.push({lane:Math.floor(Math.random()*3),z:1000});}
function loop(){if(!on)return;requestAnimationFrame(loop);spawn();var sp=(mode=='bike'?8:6)+dist*0.0006;dist+=sp*0.18;for(var i=0;i<obs.length;i++)obs[i].z-=sp*10;for(var i=0;i<coins.length;i++)coins[i].z-=sp*10;obs=obs.filter(function(o){return o.z>-120});coins=coins.filter(function(c){return c.z>-120});for(var i=obs.length-1;i>=0;i--){var o=obs[i];if(o.z<150&&o.z>35&&o.lane==lane){if(jump>0||slide>0){score+=5;obs.splice(i,1);}else{jump=20;score=Math.max(0,score-3);obs.splice(i,1);}}}for(var i=coins.length-1;i>=0;i--){var c=coins[i];if(c.z<130&&c.z>35&&c.lane==lane){coins.splice(i,1);score+=10;talia++;}}if(jump>0)jump--;if(slide>0)slide--;X.clearRect(0,0,W,H);var roadTop=H*0.50,rb=W*0.98,rt=W*0.40;X.save();X.beginPath();X.moveTo(W/2-rt/2,roadTop);X.lineTo(W/2-rb/2,H);X.lineTo(W/2+rb/2,H);X.lineTo(W/2+rt/2,roadTop);X.closePath();var g=X.createLinearGradient(0,roadTop,0,H);g.addColorStop(0,'rgba(90,60,25,0.45)');g.addColorStop(1,'rgba(60,35,12,0.82)');X.fillStyle=g;X.fill();X.strokeStyle='rgba(255,255,255,0.9)';X.lineWidth=3;X.setLineDash([30,26]);var off=(Date.now()*0.09)%56;X.lineDashOffset=-off;for(var l=-0.5;l<=0.5;l+=1){var sx=W/2+l*rt*0.5,ex=W/2+l*rb*0.42;X.beginPath();X.moveTo(sx,roadTop);X.lineTo(ex,H);X.stroke();}X.setLineDash([]);X.restore();coins.forEach(function(c){var sc=350/(c.z+350);if(sc<0.09)return;var y=roadTop+(H-roadTop)*(1-sc);var x=W/2+(c.lane-1)*rb*0.30*sc;X.font=(34*sc+26)+'px Arial';X.fillText('🍓',x-17,y);});obs.forEach(function(o){var sc=350/(o.z+350);if(sc<0.10)return;var y=roadTop+(H-roadTop)*(1-sc);var x=W/2+(o.lane-1)*rb*0.30*sc;X.fillStyle='#1e0a00';X.fillRect(x-50*sc,y-12*sc,100*sc,24*sc);});var lx=W/2+(lane-1)*W*0.28,py=H*0.86-jump*4+(slide?25:0);X.fillStyle='rgba(0,0,0,0.5)';X.beginPath();X.ellipse(lx,H*0.92,40,10,0,0,Math.PI*2);X.fill();X.save();X.translate(lx,py);if(mode=='foot'){var t=Date.now()*0.02;if(jump>0){X.translate(0,-jump*0.8);X.fillStyle='#ec4899';X.fillRect(-20,-50,40,36);X.fillStyle='#fde68a';X.beginPath();X.arc(0,-62,13,0,Math.PI*2);X.fill();}else{X.fillStyle='#ec4899';X.fillRect(-18,-48,36,36);X.fillStyle='#fde68a';X.beginPath();X.arc(0,-60,12,0,Math.PI*2);X.fill();}}else{X.font='70px Arial';X.textAlign='center';X.fillText('🏍️',0,20);}X.restore();document.getElementById('sc').innerText=score;document.getElementById('ds').innerText=Math.floor(dist);document.getElementById('ta').innerText=talia;}
function L(){lane=Math.max(0,lane-1);}function Rr(){lane=Math.min(2,lane+1);}function J(){if(jump==0&&slide==0)jump=28;}function S(){if(slide==0&&jump==0)slide=28;}
document.getElementById('btnL').onclick=L;document.getElementById('btnR').onclick=Rr;document.getElementById('btnJ').onclick=J;document.getElementById('btnS').onclick=S;
</script></body></html>
