<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GIFT GAME - REAL Photos</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#000;overflow:hidden;font-family:system-ui}#bg{position:absolute;inset:0;background:url('IMG-20250910-WA5744.jpg') center/cover no-repeat;filter:brightness(1.1)}#c{position:absolute;inset:0;width:100%;height:100%}#hud{position:absolute;top:0;left:0;right:0;z-index:10;padding:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}.row{display:flex;gap:6px;justify-content:center}.pill{pointer-events:auto;padding:8px 12px;border-radius:20px;background:rgba(0,0,0,0.75);border:2px solid #22c55e;color:#fff;font-weight:800;font-size:11px}.pill.on{background:#22c55e;color:#000}#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,0.9);padding:22px;border-radius:20px;border:3px solid #22c55e;text-align:center;color:#fff;max-width:90%}#swipe{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px;font-size:11px;z-index:10;color:#fff}#runnerImg{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);width:90px;height:130px;z-index:5;pointer-events:none;display:none;object-fit:contain}</style></head><body>
<div id="bg"></div><canvas id="c"></canvas><img id="runnerImg" src="IMG-20250910-WA9098.jpg">
<div id="hud"><div class="row"><button class="pill on" id="bf" onclick="setMode('foot')">FOOT - Real Child</button><button class="pill" id="bb" onclick="setMode('bike')">BIKE - Real Racing</button></div><div class="row"><span class="pill">SCORE <span id="sc">0</span> | <span id="ds">0</span>m | HIGH <span id="hs">0</span></span></div></div><div id="swipe">↔️ Swipe LEFT/RIGHT • ⬆️ UP=JUMP • ⬇️ DOWN=SLIDE — EXACT Temple Run!</div><div id="msg"><h2 style="color:#22c55e">🌳 GIFT GAME - REAL PHOTOS 🌍</h2><p style="font-size:12px">Using YOUR real photos!<br>Forest = YOUR forest photo<br>Runner = YOUR child photo (78)<br>Bike = Real racing bike dashcam<br>Controls = EXACT Temple Run swipe!</p><button class="pill on" style="font-size:15px;padding:12px 26px;margin-top:10px" onclick="startGame()">▶️ PLAY WITH YOUR PHOTOS</button></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight;function R(){W=innerWidth;H=innerHeight;let d=devicePixelRatio||1;canvas.width=W*d;canvas.height=H*d;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);}R();addEventListener('resize',R);
let mode='foot',lane=1,score=0,dist=0,high=0,base=5,speed=5,on=false,jump=0,slide=0,voice=true,ac=null,osc=null,gain=null;let obs=[],coins=[];let african=null;
function initV(){let v=speechSynthesis.getVoices();african=v.find(x=>x.lang.includes('en-KE'))||v.find(x=>x.lang.includes('en-NG'))||v[0];}speechSynthesis.onvoiceschanged=initV;initV();
function speak(t){if(!voice)return;initV();let u=new SpeechSynthesisUtterance(t);if(african){u.voice=african;u.lang=african.lang;}u.rate=0.9;u.pitch=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
function setMode(m){mode=m;document.getElementById('bf').classList.toggle('on',m==='foot');document.getElementById('bb').classList.toggle('on',m==='bike');base=m==='bike'?7:5;document.getElementById('runnerImg').style.display=m==='foot'&&on?'block':'none';}
function startGame(){on=true;score=0;dist=0;lane=1;obs=[];coins=[];jump=0;slide=0;document.getElementById('msg').style.display='none';if(mode==='foot')document.getElementById('runnerImg').style.display='block';speak("Kimbia Gift! Temple Run!");requestAnimationFrame(loop);}
function spawn(){if(Math.random()<0.02)obs.push({lane:Math.floor(Math.random()*3),z:1000,type:Math.random()<0.5?'log':'rock'});if(Math.random()<0.05)coins.push({lane:Math.floor(Math.random()*3),z:1000,b:Math.random()*6});}
function loop(){if(!on)return;requestAnimationFrame(loop);spawn();speed=base+dist*0.0006;dist+=speed*0.14;obs.forEach(o=>o.z-=speed*7);coins.forEach(c=>{c.z-=speed*7;c.b+=0.13;});obs=obs.filter(o=>o.z>-80);coins=coins.filter(c=>c.z>-80);obs.forEach((o,i)=>{if(o.z<115&&o.z>10&&o.lane===lane){if(o.type==='log'&&jump>9){score+=5;obs.splice(i,1);}else if(o.type==='rock'&&slide>9){score+=5;obs.splice(i,1);}else{if(jump===0)jump=24;obs.splice(i,1);}}});coins.forEach((c,i)=>{if(c.z<100&&c.z>8&&c.lane===lane){coins.splice(i,1);score+=10;high=Math.max(high,score);}});if(jump>0)jump--;if(slide>0)slide--;draw();document.getElementById('sc').innerText=score;document.getElementById('ds').innerText=Math.floor(dist);document.getElementById('hs').innerText=high;}
function draw(){let horizon=H*0.38;ctx.clearRect(0,0,W,H);let roadWb=W*0.9,roadWt=10;ctx.save();ctx.beginPath();ctx.moveTo(W/2-roadWt/2,horizon);ctx.lineTo(W/2-roadWb/2,H);ctx.lineTo(W/2+roadWb/2,H);ctx.lineTo(W/2+roadWt/2,horizon);ctx.closePath();let rg=ctx.createLinearGradient(0,horizon,0,H);rg.addColorStop(0,'rgba(166,124,82,0.3)');rg.addColorStop(1,'rgba(90,60,30,0.5)');ctx.fillStyle=rg;ctx.fill();ctx.setLineDash([14,14]);ctx.strokeStyle='rgba(255,255,255,0.5)';for(let l=-0.5;l<=0.5;l+=1){let sx=W/2+l*roadWt*0.6,ex=W/2+l*roadWb*0.45;ctx.beginPath();ctx.moveTo(sx,horizon);ctx.lineTo(ex,H);ctx.stroke();}ctx.setLineDash([]);coins.forEach(c=>{let sc=260/(c.z+260);if(sc<0.05)return;let y=horizon+(H-horizon)*(1-sc)-Math.sin(c.b)*5;let x=W/2+(c.lane-1)*roadWb*0.22*sc;ctx.font=(20*sc+16)+'px Arial';ctx.fillText('🍓',x-12,y);});obs.forEach(o=>{let sc=260/(o.z+260);if(sc<0.07)return;let y=horizon+(H-horizon)*(1-sc);let x=W/2+(o.lane-1)*roadWb*0.22*sc;if(o.type==='log'){ctx.fillStyle='#4a2510';ctx.fillRect(x-32*sc,y-5*sc,64*sc,10*sc);}else{ctx.fillStyle='#555';ctx.beginPath();ctx.ellipse(x,y,16*sc,10*sc,0,0,Math.PI*2);ctx.fill();}});ctx.restore();let lx=W/2+(lane-1)*W*0.19,py=H*0.78-jump*3.2+(slide?18:0);if(mode==='foot'){let img=document.getElementById('runnerImg');img.style.left=(lx-45)+'px';img.style.top=(py-80)+'px';img.style.transform=slide?'scaleY(0.6)':'scaleY(1)';if(jump>0)img.style.transform+=' translateY(-20px)';}else{ctx.save();ctx.translate(lx,py);ctx.rotate((lane-1)*0.28);ctx.font='56px Arial';ctx.fillText('🏍️',-28,12);ctx.restore();}}
let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){if(dx>35)lane=Math.min(2,lane+1);else if(dx<-35)lane=Math.max(0,lane-1);}else{if(dy<-35&&jump===0)jump=26;else if(dy>35&&slide===0)slide=22;}},{passive:false});
</script></body></html>
